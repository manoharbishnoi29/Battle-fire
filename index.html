<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BATTLE FIRE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:Arial}
canvas{display:block;touch-action:none}

#logo{
position:absolute;top:12px;left:12px;
font-size:25px;font-weight:900;color:white;
text-shadow:2px 3px 5px red
}
#stats{
position:absolute;top:52px;left:12px;
color:white;background:#101820cc;
padding:9px;border-radius:8px;font-size:13px;
line-height:22px
}
#map{
position:absolute;right:12px;top:12px;
width:95px;height:95px;
border:2px solid white;border-radius:8px;
background:#647b48
}
#joy{
position:absolute;bottom:30px;left:22px;
width:125px;height:125px;border-radius:50%;
background:#ffffff35;border:2px solid white;
touch-action:none
}
#stick{
position:absolute;left:36px;top:36px;
width:49px;height:49px;border-radius:50%;
background:white
}
#jump{
position:absolute;right:25px;bottom:45px;
width:72px;height:72px;border-radius:50%;
background:#e52d2d;color:white;
border:3px solid white;font-weight:bold
}
#hint{
position:absolute;bottom:8px;left:50%;
transform:translateX(-50%);
color:white;background:#111b;
padding:7px;border-radius:7px;
font-size:11px;white-space:nowrap
}
</style>
</head>

<body>

<div id="logo">🔥 BATTLE FIRE</div>

<div id="stats">
PLAYERS TARGET: 50<br>
MODE: BATTLE ARENA<br>
HP: 200/200
</div>

<div id="map"></div>

<div id="joy"><div id="stick"></div></div>
<button id="jump">JUMP</button>
<div id="hint">MOVE: JOYSTICK | LOOK: DRAG SCREEN</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9e9);
scene.fog=new THREE.Fog(0x91c9e9,100,330);

const camera=new THREE.PerspectiveCamera(
65,innerWidth/innerHeight,.1,600
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// LIGHTING

scene.add(new THREE.HemisphereLight(0xffffff,0x52633b,2));

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(70,100,50);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

function material(color){
return new THREE.MeshStandardMaterial({
color:color,roughness:.85
});
}

// GROUND

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(500,500),
material(0x668849)
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// WATER

const water=new THREE.Mesh(
new THREE.PlaneGeometry(850,850),
material(0x167eb8)
);
water.rotation.x=-Math.PI/2;
water.position.y=-1;
scene.add(water);

// COLLISION DATA

const obstacles=[];

function addBox(x,z,w,d){
obstacles.push({
type:"box",
x:x,z:z,w:w,d:d
});
}

function addCircle(x,z,r){
obstacles.push({
type:"circle",
x:x,z:z,r:r
});
}

// ROADS

function road(x,z,w,d){
const mesh=new THREE.Mesh(
new THREE.BoxGeometry(w,.12,d),
material(0x34383c)
);
mesh.position.set(x,.07,z);
scene.add(mesh);
}

road(0,0,18,300);
road(0,0,300,15);
road(-65,0,12,300);
road(65,0,12,300);
road(0,-65,300,12);
road(0,65,300,12);

// ROAD MARKINGS

for(let z=-140;z<150;z+=13){
const line=new THREE.Mesh(
new THREE.BoxGeometry(.3,.14,6),
material(0xe9dfae)
);
line.position.set(0,.15,z);
scene.add(line);
}

// BUILDINGS

function building(x,z,w,h,d,color){

const group=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
material(color)
);

body.position.y=h/2;
body.castShadow=true;
body.receiveShadow=true;
group.add(body);

const roof=new THREE.Mesh(
new THREE.BoxGeometry(w+.5,.6,d+.5),
material(0x45484b)
);

roof.position.y=h+.3;
group.add(roof);

// WINDOWS

for(let y=2;y<h-1;y+=3){
for(let side of [-1,1]){
const win=new THREE.Mesh(
new THREE.BoxGeometry(w*.5,1,.12),
new THREE.MeshStandardMaterial({
color:0x91d5ed,
roughness:.3
})
);
win.position.set(0,y,side*(d/2+.07));
group.add(win);
}
}

group.position.set(x,0,z);
scene.add(group);

addBox(x,z,w,d);
}

// CITY

const colors=[
0xb9a68e,0x899fae,0xc4b8a5,
0x9a9a91,0xb67e69,0x777f88
];

for(let x=-120;x<=120;x+=30){
for(let z=-120;z<=120;z+=30){

if(Math.abs(x)<18||Math.abs(z)<18)continue;

const w=12+Math.random()*4;
const d=12+Math.random()*4;
const h=8+Math.random()*15;

building(
x,z,w,h,d,
colors[Math.floor(Math.random()*colors.length)]
);
}
}

// TREES

function tree(x,z){

const trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.35,.45,3,8),
material(0x68401f)
);

trunk.position.set(x,1.5,z);
trunk.castShadow=true;
scene.add(trunk);

const leaves=new THREE.Mesh(
new THREE.ConeGeometry(2.4,5,8),
material(0x23652c)
);

leaves.position.set(x,5,z);
leaves.castShadow=true;
scene.add(leaves);

addCircle(x,z,.8);
}

for(let i=0;i<100;i++){

const x=Math.random()*300-150;
const z=Math.random()*300-150;

if(Math.abs(x)<25||Math.abs(z)<25)continue;

tree(x,z);
}

// MOUNTAINS

for(let i=0;i<24;i++){

const angle=i/24*Math.PI*2;
const radius=205;

const mountain=new THREE.Mesh(
new THREE.ConeGeometry(
22+Math.random()*15,
40+Math.random()*35,
7
),
material(0x667c65)
);

mountain.position.set(
Math.cos(angle)*radius,
20,
Math.sin(angle)*radius
);

scene.add(mountain);
}

// PLAYER

const player=new THREE.Group();
scene.add(player);

// MATERIALS

const shirt=material(0x172d4c);
const pants=material(0x20242c);
const skin=material(0xc58d69);
const shoes=material(0x151515);

// BODY

const torso=new THREE.Mesh(
new THREE.CapsuleGeometry(.42,.75,5,10),
shirt
);
torso.position.y=1.25;
torso.castShadow=true;
player.add(torso);

// HEAD

const head=new THREE.Mesh(
new THREE.SphereGeometry(.29,20,16),
skin
);
head.position.y=2.15;
player.add(head);

// HAIR

const hair=new THREE.Mesh(
new THREE.SphereGeometry(.3,16,12),
material(0x202020)
);
hair.scale.y=.45;
hair.position.y=2.34;
player.add(hair);

// BACKPACK

const bag=new THREE.Mesh(
new THREE.BoxGeometry(.65,.75,.3),
material(0x333d29)
);
bag.position.set(0,1.35,-.46);
player.add(bag);

// ARMS

const arms=[];

for(const side of [-1,1]){

const arm=new THREE.Mesh(
new THREE.CapsuleGeometry(.13,.65,4,8),
shirt
);

arm.position.set(side*.53,1.25,0);
arm.rotation.z=side*.15;
player.add(arm);
arms.push(arm);

// HANDS

const hand=new THREE.Mesh(
new THREE.SphereGeometry(.14,12,10),
skin
);
hand.position.set(side*.55,.82,0);
player.add(hand);

// LEGS

const leg=new THREE.Mesh(
new THREE.CapsuleGeometry(.15,.55,4,8),
pants
);
leg.position.set(side*.2,.43,0);
player.add(leg);

// SHOES

const shoe=new THREE.Mesh(
new THREE.BoxGeometry(.3,.16,.42),
shoes
);
shoe.position.set(side*.2,.12,.08);
player.add(shoe);
}

const playerRadius=.65;

// PLAYER COLLISION

function collides(x,z){

for(const o of obstacles){

if(o.type==="circle"){

const dx=x-o.x;
const dz=z-o.z;

if(Math.hypot(dx,dz)<o.r+playerRadius){
return true;
}

}else{

const closestX=THREE.MathUtils.clamp(
x,o.x-o.w/2,o.x+o.w/2
);

const closestZ=THREE.MathUtils.clamp(
z,o.z-o.d/2,o.z+o.d/2
);

const dx=x-closestX;
const dz=z-closestZ;

if(dx*dx+dz*dz<playerRadius*playerRadius){
return true;
}
}
}

return false;
}

// CAMERA

let angle=0;
let distance=7;
let height=3.3;

function updateCamera(){

camera.position.set(
player.position.x+Math.sin(angle)*distance,
player.position.y+height,
player.position.z+Math.cos(angle)*distance
);

camera.lookAt(
player.position.x,
player.position.y+1.25,
player.position.z
);
}

// JOYSTICK

let moveX=0,moveY=0,dragging=false;

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");

function moveJoystick(e){

const r=joy.getBoundingClientRect();

let x=e.clientX-r.left-62.5;
let y=e.clientY-r.top-62.5;

const len=Math.hypot(x,y);

if(len>42){
x=x/len*42;
y=y/len*42;
}

stick.style.left=(38+x)+"px";
stick.style.top=(38+y)+"px";

moveX=x/42;
moveY=y/42;
}

joy.addEventListener("pointerdown",e=>{
dragging=true;
joy.setPointerCapture(e.pointerId);
moveJoystick(e);
});

joy.addEventListener("pointermove",e=>{
if(dragging)moveJoystick(e);
});

function stopJoystick(){
dragging=false;
moveX=0;
moveY=0;
stick.style.left="38px";
stick.style.top="38px";
}

joy.addEventListener("pointerup",stopJoystick);
joy.addEventListener("pointercancel",stopJoystick);

// CAMERA CONTROL

let lastX=null;

renderer.domElement.addEventListener("pointerdown",e=>{
lastX=e.clientX;
});

renderer.domElement.addEventListener("pointermove",e=>{
if(lastX!==null){
angle+=(lastX-e.clientX)*.006;
lastX=e.clientX;
}
});

renderer.domElement.addEventListener("pointerup",()=>{
lastX=null;
});

renderer.domElement.addEventListener("pointercancel",()=>{
lastX=null;
});

// JUMP

let jumpVelocity=0;
let grounded=true;

document.getElementById("jump").onclick=()=>{
if(grounded){
jumpVelocity=.22;
grounded=false;
}
};

// KEYBOARD

const keys={};

window.addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
});

window.addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

// MOVEMENT

function movePlayer(dx,dz){

const oldX=player.position.x;
const oldZ=player.position.z;

// Separate axis checks help slide along walls

if(!collides(oldX+dx,oldZ)){
player.position.x+=dx;
}

if(!collides(player.position.x,oldZ+dz)){
player.position.z+=dz;
}
}

// ANIMATION

let walkTime=0;

function animate(){

requestAnimationFrame(animate);

let forward=moveY;
let side=moveX;

if(keys.w||keys.arrowup)forward=-1;
if(keys.s||keys.arrowdown)forward=1;
if(keys.a||keys.arrowleft)side=-1;
if(keys.d||keys.arrowright)side=1;

const length=Math.hypot(forward,side);

if(length>1){
forward/=length;
side/=length;
}

const speed=.15;

const dx=(
Math.sin(angle)*forward+
Math.cos(angle)*side
)*speed;

const dz=(
Math.cos(angle)*forward-
Math.sin(angle)*side
)*speed;

movePlayer(dx,dz);

// CHARACTER FACING

if(Math.abs(dx)+Math.abs(dz)>.001){

player.rotation.y=Math.atan2(dx,dz);
walkTime+=.15;

arms[0].rotation.x=Math.sin(walkTime)*.35;
arms[1].rotation.x=-Math.sin(walkTime)*.35;

}else{
arms[0].rotation.x=0;
arms[1].rotation.x=0;
}

// JUMP

if(!grounded){

player.position.y+=jumpVelocity;
jumpVelocity-=.012;

if(player.position.y<=0){
player.position.y=0;
jumpVelocity=0;
grounded=true;
}
}

// UPDATE CAMERA

updateCamera();

renderer.render(scene,camera);
}

updateCamera();
animate();

// RESIZE

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
